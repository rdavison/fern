name = "fern"
version = "0.1.0"
defaultTargets = ["Fern", "FernAudit"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "master"

[[lean_lib]]
name = "Fern"
weakLeanOptions = {"experimental.module" = true}

[[lean_exe]]
name = "fern-exe"
root = "Main"

[[lean_exe]]
name = "fern-solve"
root = "Solve"

[[lean_lib]]
name = "FernImpl"
precompileModules = true
weakLeanOptions = {"experimental.module" = true}

[[lean_lib]]
name = "FernAudit"
